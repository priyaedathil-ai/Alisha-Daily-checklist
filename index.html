<style>
:root {
  --pink: #f4b7d7;
  --pink-light: #fff1f7;
  --lavender: #b9a0e8;
  --lavender-light: #f1ebff;
  --blue-light: #e5f4ff;
  --mint-light: #e7f8f1;
  --yellow-light: #fff7d9;
  --text: #55485d;
  --muted: #8b7c91;
  --white: rgba(255,255,255,.94);
  --green: #64b889;
  --red: #df7373;
  --shadow: 0 10px 30px rgba(115, 87, 126, .12);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  min-height: 100%;
  background: #f9eff8;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: var(--text);
  overflow-x: hidden;

  background:
    radial-gradient(circle at 8% 12%, rgba(255,255,255,.85) 0 4px, transparent 5px),
    radial-gradient(circle at 90% 18%, rgba(255,255,255,.8) 0 5px, transparent 6px),
    linear-gradient(135deg, #fcecf5 0%, #eee9fb 48%, #e8f5fc 100%);
}

/* Decorative background */

.background-art {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.cloud {
  position: absolute;
  width: 130px;
  height: 45px;
  border-radius: 50px;
  background: rgba(255,255,255,.58);
  filter: blur(.2px);
}

.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: inherit;
}

.cloud::before {
  width: 58px;
  height: 58px;
  left: 20px;
  top: -28px;
}

.cloud::after {
  width: 72px;
  height: 72px;
  right: 17px;
  top: -38px;
}

.cloud.one {
  top: 110px;
  left: -45px;
}

.cloud.two {
  top: 260px;
  right: -60px;
  transform: scale(.8);
}

.star {
  position: absolute;
  font-size: 25px;
  opacity: .62;
}

.star.s1 { top: 100px; left: 8%; }
.star.s2 { top: 210px; right: 8%; }
.star.s3 { top: 460px; left: 4%; }
.star.s4 { top: 650px; right: 5%; }

.heart {
  position: absolute;
  font-size: 28px;
  opacity: .48;
}

.heart.h1 { top: 145px; right: 12%; }
.heart.h2 { top: 520px; left: 7%; }

.butterfly {
  position: absolute;
  top: 175px;
  left: 12%;
  font-size: 30px;
  opacity: .55;
  transform: rotate(-10deg);
}

.flower {
  position: absolute;
  font-size: 28px;
  opacity: .45;
}

.flower.f1 { bottom: 90px; left: 5%; }
.flower.f2 { bottom: 170px; right: 5%; }

.rainbow {
  position: absolute;
  top: 25px;
  right: -45px;
  width: 170px;
  height: 85px;
  border-radius: 170px 170px 0 0;
  border: 10px solid rgba(245,182,211,.28);
  border-bottom: 0;
  transform: rotate(10deg);
}

.rainbow::before {
  content: "";
  position: absolute;
  inset: 13px 13px 0;
  border-radius: 150px 150px 0 0;
  border: 10px solid rgba(183,159,231,.25);
  border-bottom: 0;
}

.rainbow::after {
  content: "";
  position: absolute;
  inset: 26px 26px 0;
  border-radius: 130px 130px 0 0;
  border: 10px solid rgba(165,215,237,.28);
  border-bottom: 0;
}

/* Main */

.app {
  position: relative;
  z-index: 1;
  width: min(960px, 94%);
  margin: 0 auto;
  padding: 28px 0 60px;
}

/* Header */

.header {
  position: relative;
  background: var(--white);
  border: 1px solid rgba(255,255,255,.9);
  border-radius: 30px;
  box-shadow: var(--shadow);
  padding: 25px 22px 20px;
  text-align: center;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.app-icon {
  width: 82px;
  height: 82px;
  margin: 0 auto 8px;
  border-radius: 24px;
  background: linear-gradient(135deg, #f8d9e9, #e8ddfa, #dceffc);
  box-shadow:
    0 8px 18px rgba(134, 104, 151, .16),
    inset 0 1px 1px rgba(255,255,255,.9);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.app-icon svg {
  width: 100%;
  height: 100%;
}

h1 {
  margin: 4px 0 2px;
  font-size: clamp(25px, 6vw, 38px);
  color: #755a80;
  letter-spacing: -.5px;
}

.subtitle {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}

.date {
  margin-top: 12px;
  font-size: 14px;
  font-weight: 600;
  color: #92799b;
}

/* Tabs */

.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 16px;
}

.tab {
  border: 0;
  padding: 13px 8px;
  border-radius: 18px;
  background: rgba(255,255,255,.7);
  color: #806d87;
  font-weight: 700;
  cursor: pointer;
  font-size: 14px;
  transition: .2s ease;
}

.tab.active {
  background: linear-gradient(135deg, #f7c9df, #d9cef4);
  color: #614e6b;
  box-shadow: 0 6px 16px rgba(143, 111, 157, .13);
}

/* Page */

.page {
  display: none;
  margin-top: 18px;
}

.page.active {
  display: block;
}

/* Progress summary */

.summary {
  background: var(--white);
  border-radius: 25px;
  padding: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}

.summary-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.summary-title {
  font-weight: 800;
  font-size: 18px;
}

.summary-stars {
  font-size: 15px;
  font-weight: 800;
  color: #9a709c;
  white-space: nowrap;
}

.progress-track {
  height: 15px;
  border-radius: 20px;
  background: #eee9f2;
  overflow: hidden;
  margin-top: 14px;
}

.progress-fill {
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(
    90deg,
    #f4a9cf,
    #c9a8ec,
    #9fd6ef,
    #a9dfc6
  );
  transition: width .3s ease;
}

.percent {
  text-align: center;
  font-size: 28px;
  font-weight: 900;
  color: #775b82;
  margin-top: 10px;
}

.encouragement {
  text-align: center;
  color: #88738f;
  font-size: 14px;
  margin-top: 3px;
}

/* Action buttons */

.action-row {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

.action-btn {
  flex: 1;
  border: 0;
  border-radius: 16px;
  padding: 12px;
  font-weight: 800;
  cursor: pointer;
  color: #68566f;
  background: #f3ebfa;
}

.action-btn.clear {
  background: #fff0f3;
  color: #9b656f;
}

.action-btn:active,
.tab:active,
.view-btn:active,
.reward-option:active {
  transform: scale(.98);
}

/* Checklist sections */

.section {
  background: var(--white);
  border-radius: 25px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.section:nth-child(2) {
  background: linear-gradient(135deg, rgba(255,255,255,.96), #fff4fa);
}

.section:nth-child(3) {
  background: linear-gradient(135deg, rgba(255,255,255,.96), #f5f0ff);
}

.section:nth-child(4) {
  background: linear-gradient(135deg, rgba(255,255,255,.96), #eef9ff);
}

.section-title {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 13px;
  font-size: 19px;
  font-weight: 900;
}

.section-title .emoji {
  font-size: 25px;
}

.task-list {
  display: grid;
  gap: 9px;
}

.task {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 12px;
  border-radius: 16px;
  background: rgba(255,255,255,.72);
  border: 1px solid rgba(232,222,238,.8);
  cursor: pointer;
  user-select: none;
  transition: .18s ease;
}

.task:hover {
  background: #fff;
}

.task.checked {
  background: linear-gradient(
    90deg,
    rgba(230,249,240,.9),
    rgba(244,239,255,.9)
  );
}

.checkbox {
  width: 27px;
  height: 27px;
  min-width: 27px;
  border-radius: 9px;
  border: 2px solid #c9b8d1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
  color: white;
  font-size: 17px;
  font-weight: 900;
}

.task.checked .checkbox {
  background: linear-gradient(135deg, #78c99b, #78b8dc);
  border-color: transparent;
}

.task-text {
  font-size: 15px;
  line-height: 1.35;
  font-weight: 650;
  color: #63566a;
}

.task.checked .task-text {
  text-decoration: line-through;
  opacity: .65;
}

/* Star */

.star-badge {
  margin-left: auto;
  font-size: 17px;
  opacity: .3;
}

.task.checked .star-badge {
  opacity: 1;
}

/* Progress page */

.journey {
  background: var(--white);
  border-radius: 25px;
  padding: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}

.journey h2,
.reward-box h2 {
  margin: 0 0 15px;
  font-size: 20px;
}

.star-journey {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 7px;
  overflow-x: auto;
}

.journey-day {
  min-width: 75px;
  text-align: center;
  padding: 10px 5px;
  border-radius: 17px;
  background: linear-gradient(180deg, #fff5fa, #f1ecff);
}

.journey-star {
  font-size: 30px;
  line-height: 1;
}

.journey-day-name {
  margin-top: 5px;
  font-size: 11px;
  font-weight: 800;
  color: #7e6b84;
}

.journey-count {
  font-size: 12px;
  font-weight: 800;
  color: #9a789e;
}

.progress-card {
  background: var(--white);
  border-radius: 24px;
  padding: 18px;
  margin-bottom: 13px;
  box-shadow: var(--shadow);
}

.progress-card:nth-child(odd) {
  background: linear-gradient(135deg, #fff, #fff3f9);
}

.progress-card:nth-child(even) {
  background: linear-gradient(135deg, #fff, #f3efff);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.card-date {
  font-weight: 900;
  font-size: 17px;
}

.card-stars {
  font-weight: 900;
  color: #8e7097;
  white-space: nowrap;
}

.card-percent {
  margin-top: 10px;
  font-size: 28px;
  font-weight: 900;
  color: #765b80;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  font-weight: 900;
  margin-top: 4px;
}

.status.done {
  color: var(--green);
}

.status.keep {
  color: var(--red);
}

.card-message {
  margin-top: 7px;
  color: #86738b;
  font-size: 13px;
}

.view-btn {
  margin-top: 13px;
  border: 0;
  border-radius: 14px;
  background: #eee7f9;
  color: #6c5a75;
  font-weight: 800;
  padding: 10px 16px;
  cursor: pointer;
}

/* Reward */

.reward-box {
  background: var(--white);
  border-radius: 25px;
  padding: 20px;
  box-shadow: var(--shadow);
}

.reward-options {
  display: grid;
  gap: 10px;
}

.reward-option {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 14px;
  border-radius: 17px;
  background: #faf7fd;
  border: 1px solid #eee7f4;
  cursor: pointer;
  font-weight: 700;
  color: #65576c;
}

.reward-option input {
  accent-color: #ad8bda;
  width: 19px;
  height: 19px;
}

.selected-reward {
  margin-top: 17px;
  padding: 15px;
  border-radius: 18px;
  background: linear-gradient(135deg, #fff0f7, #f0ebff);
  text-align: center;
  font-weight: 900;
  color: #735c7d;
}

.weekly-progress {
  margin-top: 15px;
  padding: 15px;
  border-radius: 18px;
  background: #f4fbf7;
  text-align: center;
}

.weekly-progress strong {
  display: block;
  font-size: 23px;
  color: #659b7d;
}

/* Modal */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(62, 47, 69, .38);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 20;
}

.modal-backdrop.open {
  display: flex;
}

.modal {
  width: min(650px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  background: #fff;
  border-radius: 28px;
  padding: 20px;
  box-shadow: 0 20px 60px rgba(54,39,61,.25);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  margin-bottom: 14px;
}

.modal-title {
  font-size: 21px;
  font-weight: 900;
  color: #715a78;
}

.close-btn {
  border: 0;
  background: #f3edf7;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  color: #735e7a;
}

.modal-section {
  margin-top: 15px;
}

.modal-section h3 {
  font-size: 16px;
  margin: 0 0 8px;
}

.modal-task {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  border-radius: 12px;
  margin-bottom: 5px;
  background: #faf8fb;
  font-size: 13px;
}

.modal-check {
  font-size: 17px;
}

.modal-check.complete {
  color: var(--green);
}

.modal-check.incomplete {
  color: #c9becd;
}

/* Footer */

.footer {
  text-align: center;
  color: #a08fa5;
  font-size: 12px;
  margin-top: 20px;
}

/* Mobile */

@media (max-width: 650px) {
  .app {
    width: 94%;
    padding-top: 16px;
  }

  .header {
    padding: 20px 15px 17px;
    border-radius: 25px;
  }

  .app-icon {
    width: 70px;
    height: 70px;
    border-radius: 21px;
  }

  .tab {
    font-size: 12px;
    padding: 12px 5px;
  }

  .section {
    padding: 15px;
  }

  .task {
    padding: 12px 10px;
  }

  .task-text {
    font-size: 14px;
  }

  .star-journey {
    grid-template-columns: repeat(7, 75px);
  }
}
</style>
</head>

  <div class="heart h1">♡</div>

  </div>

  <h1>🌸 Alisha's Checklist</h1>

  <p class="subtitle">
    Learn • Play • Shine • Grow
  </p>

  <div class="date" id="todayDate"></div>

  <nav class="tabs" aria-label="Main navigation">
    <button class="tab active" data-page="today">🌸 TODAY</button>
    <button class="tab" data-page="progress">⭐ PROGRESS</button>
    <button class="tab" data-page="reward">🎁 REWARD</button>
  </nav>

</header>

<!-- TODAY -->

<section class="page active" id="today">

  <div class="summary">

    <div class="summary-top">
      <div class="summary-title">Today's Progress</div>
      <div class="summary-stars" id="todayStars">0 / 37 Stars</div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="todayProgress"></div>
    </div>

    <div class="percent" id="todayPercent">0%</div>

    <div class="encouragement" id="todayMessage">
      Every little step helps you shine! ✨
    </div>

  </div>

  <div class="action-row">
    <button class="action-btn" id="selectAllBtn">
      ✓ SELECT ALL
    </button>

    <button class="action-btn clear" id="clearAllBtn">
      CLEAR ALL
    </button>
  </div>

  <div id="checklistContainer"></div>

</section>

<!-- PROGRESS -->

<section class="page" id="progress">

  <div class="journey">

    <h2>⭐ 7-Day Star Journey</h2>

    <div class="star-journey" id="starJourney"></div>

  </div>

  <div id="progressCards"></div>

</section>

<!-- REWARD -->

<section class="page" id="reward">

  <div class="reward-box">

    <h2>🎁 Choose Your Reward</h2>

    <div class="reward-options">

      <label class="reward-option">
        <input type="radio" name="reward" value="Movie Night">
        <span>🎬 Movie Night</span>
      </label>

      <label class="reward-option">
        <input type="radio" name="reward" value="Ice Cream Date">
        <span>🍦 Ice Cream Date</span>
      </label>

      <label class="reward-option">
        <input type="radio" name="reward" value="Special Family Outing">
        <span>👨‍👩‍👧 Special Family Outing</span>
      </label>

      <label class="reward-option">
        <input type="radio" name="reward" value="Explore a New Place">
        <span>🗺️ Explore a New Place</span>
      </label>

      <label class="reward-option">
        <input type="radio" name="reward" value="Weekend Getaway">
        <span>🏝️ Weekend Getaway</span>
      </label>

      <label class="reward-option">
        <input type="radio" name="reward" value="Special Parent–Child Day">
        <span>💗 Special Parent–Child Day</span>
      </label>

      <label class="reward-option">
        <input type="radio" name="reward" value="My Own Reward">
        <span>✨ My Own Reward</span>
      </label>

    </div>

    <div class="selected-reward" id="selectedReward">
      Choose a reward above 💕
    </div>

    <div class="weekly-progress">
      <strong id="weeklyStars">0 Stars</strong>
      <span>earned across the recent 7 days</span>
    </div>

  </div>

</section>

<div class="footer">
  Made with love for Alisha 🌸✨
</div>

</main>

<!-- VIEW MODAL -->

<div class="modal-backdrop" id="viewModal">

  <div class="modal">

    <div class="modal-header">

      <div class="modal-title" id="modalTitle">
        Daily Details
      </div>

      <button class="close-btn" id="closeModal" aria-label="Close">
        ✕
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>

<script>
"use strict";

/*
  ALISHA'S DAILY CHECKLIST
  ------------------------
  Security/design notes:
  - No external JavaScript.
  - No external images.
  - No network requests.
  - No fetch(), XMLHttpRequest, WebSocket or analytics.
  - No passwords or API keys.
  - Checklist data is stored only in browser localStorage.
*/

const STORAGE_KEY = "alishaChecklistV2";

const SECTIONS = [
  {
    title: "BEFORE SCHOOL",
    emoji: "🌸",
    tasks: [
      "Wake up",
      "Make the bed",
      "Go to the toilet",
      "Brush teeth",
      "Face wash + quick shower",
      "Get dressed",
      "Apply moisturizer + sunblock",
      "Tie hair",
      "Eat breakfast",
      "Put on shoes & socks",
      "Take vitamins",
      "Wear your specs",
      "Pack school bag",
      "Make sure everything is ready before leaving"
    ]
  },
  {
    title: "AFTER SCHOOL",
    emoji: "🌈",
    tasks: [
      "Put school bag away",
      "Keep shoes on the rack",
      "Change clothes",
      "Put clothes in the laundry",
      "Wash hands",
      "Eat a healthy snack",
      "Relax / play for some time",
      "Outdoor play",
      "Dance or badminton practice",
      "Take a break",
      "Complete homework"
    ]
  },
  {
    title: "BEFORE BED",
    emoji: "🌙",
    tasks: [
      "Tidy up your area",
      "Put toys & belongings away",
      "Take a bath or shower",
      "Put pajamas on",
      "Eat dinner",
      "Brush teeth",
      "Wash face",
      "Pack school bag for tomorrow",
      "Choose clothes for tomorrow",
      "Read a bedtime story / read for 10 minutes",
      "Put in eye drops",
      "Get into bed"
    ]
  }
];

const TOTAL_TASKS = SECTIONS.reduce(
  (total, section) => total + section.tasks.length,
  0
);

const MESSAGES = [
  {
    min: 0,
    text: "Let's get started! Every little step helps you shine. ✨"
  },
  {
    min: 20,
    text: "Great start! Keep going, superstar! 🌟"
  },
  {
    min: 40,
    text: "You're doing amazing! Keep shining! 💕"
  },
  {
    min: 60,
    text: "Wow! You're making fantastic progress! 🌈"
  },
  {
    min: 80,
    text: "Almost there! You're doing brilliantly! ⭐"
  },
  {
    min: 100,
    text: "Amazing! You completed your checklist! 🎉💖"
  }
];

let appData = loadData();
let currentViewDate = null;

/* ---------- Date helpers ---------- */

function getDateKey(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

function formatDate(dateKey) {
  const parts = dateKey.split("-");

  if (parts.length !== 3) {
    return dateKey;
  }

  const date = new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2])
  );

  return date.toLocaleDateString(undefined, {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  });
}

function getRecentDateKeys(count = 7) {
  const keys = [];

  for (let i = 0; i < count; i++) {
    const date = new Date();

    date.setHours(12, 0, 0, 0);
    date.setDate(date.getDate() - i);

    keys.push(getDateKey(date));
  }

  return keys;
}

/* ---------- Storage ---------- */

function loadData() {
  let data = {
    days: {},
    reward: ""
  };

  try {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
      const parsed = JSON.parse(saved);

      if (parsed && typeof parsed === "object") {
        data = {
          days:
            parsed.days &&
            typeof parsed.days === "object"
              ? parsed.days
              : {},
          reward:
            typeof parsed.reward === "string"
              ? parsed.reward
              : ""
        };
      }
    }
  } catch (error) {
    /*
      If storage is unavailable/corrupt, the app simply starts fresh.
      No data is sent anywhere.
    */
  }

  cleanupOldDays(data);

  return data;
}

function saveData() {
  cleanupOldDays(appData);

  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(appData)
    );
  } catch (error) {
    /*
      Storage errors are intentionally ignored so the checklist
      remains usable in the current session.
    */
  }
}

function cleanupOldDays(data) {
  const recentKeys = getRecentDateKeys(7);

  Object.keys(data.days).forEach(key => {
    if (!recentKeys.includes(key)) {
      delete data.days[key];
    }
  });
}

function getDayData(dateKey) {
  if (!appData.days[dateKey]) {
    appData.days[dateKey] = {
      checked: {}
    };
  }

  if (
    !appData.days[dateKey].checked ||
    typeof appData.days[dateKey].checked !== "object"
  ) {
    appData.days[dateKey].checked = {};
  }

  return appData.days[dateKey];
}

/* ---------- Checklist ---------- */

function getAllTaskIds() {
  const ids = [];

  SECTIONS.forEach((section, sectionIndex) => {
    section.tasks.forEach((task, taskIndex) => {
      ids.push(`${sectionIndex}-${taskIndex}`);
    });
  });

  return ids;
}

function getCheckedCount(dateKey) {
  const day = getDayData(dateKey);

  return getAllTaskIds().filter(
    id => day.checked[id] === true
  ).length;
}

function getPercentage(dateKey) {
  const count = getCheckedCount(dateKey);

  return Math.round(
    (count / TOTAL_TASKS) * 100
  );
}

function getMessage(percent) {
  let message = MESSAGES[0].text;

  MESSAGES.forEach(item => {
    if (percent >= item.min) {
      message = item.text;
    }
  });

  return message;
}

function renderChecklist() {
  const container =
    document.getElementById("checklistContainer");

  const todayKey = getDateKey();
  const day = getDayData(todayKey);

  container.innerHTML = "";

  SECTIONS.forEach((section, sectionIndex) => {

    const sectionElement =
      document.createElement("div");

    sectionElement.className = "section";

    const title =
      document.createElement("div");

    title.className = "section-title";

    title.innerHTML =
      `<span class="emoji">${section.emoji}</span>
       <span>${escapeHtml(section.title)}</span>`;

    sectionElement.appendChild(title);

    const list =
      document.createElement("div");

    list.className = "task-list";

    section.tasks.forEach((task, taskIndex) => {

      const id = `${sectionIndex}-${taskIndex}`;

      const row =
        document.createElement("div");

      row.className = "task";

      if (day.checked[id]) {
        row.classList.add("checked");
      }

      row.setAttribute("role", "checkbox");
      row.setAttribute(
        "aria-checked",
        day.checked[id] ? "true" : "false"
      );
      row.tabIndex = 0;

      row.innerHTML = `
        <div class="checkbox">
          ${day.checked[id] ? "✓" : ""}
        </div>

        <div class="task-text">
          ${escapeHtml(task)}
        </div>

        <div class="star-badge">⭐</div>
      `;

      const toggle = () => {
        toggleTask(id);
      };

      row.addEventListener("click", toggle);

      row.addEventListener("keydown", event => {
        if (
          event.key === "Enter" ||
          event.key === " "
        ) {
          event.preventDefault();
          toggle();
        }
      });

      list.appendChild(row);
    });

    sectionElement.appendChild(list);
    container.appendChild(sectionElement);
  });
}

function toggleTask(id) {
  const todayKey = getDateKey();
  const day = getDayData(todayKey);

  day.checked[id] = !day.checked[id];

  saveData();
  renderChecklist();
  updateTodaySummary();
  renderProgress();
  renderReward();
}

/* ---------- TODAY summary ---------- */

function updateTodaySummary() {
  const todayKey = getDateKey();
  const count = getCheckedCount(todayKey);
  const percent = getPercentage(todayKey);

  document.getElementById("todayStars").textContent =
    `${count} / ${TOTAL_TASKS} Stars`;

  document.getElementById("todayPercent").textContent =
    `${percent}%`;

  document.getElementById("todayProgress").style.width =
    `${percent}%`;

  document.getElementById("todayMessage").textContent =
    getMessage(percent);
}

/* ---------- Select / clear ---------- */

function selectAll() {
  const todayKey = getDateKey();
  const day = getDayData(todayKey);

  getAllTaskIds().forEach(id => {
    day.checked[id] = true;
  });

  saveData();
  renderChecklist();
  updateTodaySummary();
  renderProgress();
  renderReward();
}

function clearAll() {
  const todayKey = getDateKey();
  const day = getDayData(todayKey);

  getAllTaskIds().forEach(id => {
    day.checked[id] = false;
  });

  saveData();
  renderChecklist();
  updateTodaySummary();
  renderProgress();
  renderReward();
}

document
  .getElementById("selectAllBtn")
  .addEventListener("click", selectAll);

document
  .getElementById("clearAllBtn")
  .addEventListener("click", clearAll);

/* ---------- Progress ---------- */

function renderProgress() {
  renderStarJourney();

  const container =
    document.getElementById("progressCards");

  container.innerHTML = "";

  const dates = getRecentDateKeys(7);

  dates.forEach(dateKey => {

    const count = getCheckedCount(dateKey);
    const percent = getPercentage(dateKey);

    const card =
      document.createElement("div");

    card.className = "progress-card";

    const done = percent >= 80;

    card.innerHTML = `
      <div class="card-header">
        <div class="card-date">
          ${escapeHtml(formatDate(dateKey))}
        </div>

        <div class="card-stars">
          ${count} / ${TOTAL_TASKS} ⭐
        </div>
      </div>

      <div class="card-percent">
        ${percent}%
      </div>

      <div class="status ${done ? "done" : "keep"}">
        ${done ? "✓ DONE" : "✕ KEEP GOING"}
      </div>

      <div class="card-message">
        ${escapeHtml(getMessage(percent))}
      </div>

      <button
        class="view-btn"
        type="button"
        data-view-date="${escapeHtml(dateKey)}">
        VIEW
      </button>
    `;

    container.appendChild(card);
  });

  container
    .querySelectorAll("[data-view-date]")
    .forEach(button => {
      button.addEventListener("click", () => {
        openView(button.dataset.viewDate);
      });
    });
}

function renderStarJourney() {
  const container =
    document.getElementById("starJourney");

  container.innerHTML = "";

  const dates = getRecentDateKeys(7).reverse();

  dates.forEach(dateKey => {

    const count = getCheckedCount(dateKey);

    const dateParts = dateKey.split("-");
    const date =
      new Date(
        Number(dateParts[0]),
        Number(dateParts[1]) - 1,
        Number(dateParts[2])
      );

    const dayName =
      date.toLocaleDateString(undefined, {
        weekday: "short"
      });

    const item =
      document.createElement("div");

    item.className = "journey-day";

    item.innerHTML = `
      <div class="journey-star">
        ${count > 0 ? "🌟" : "☆"}
      </div>

      <div class="journey-day-name">
        ${escapeHtml(dayName)}
      </div>

      <div class="journey-count">
        ${count} / ${TOTAL_TASKS}
      </div>
    `;

    container.appendChild(item);
  });
}

/* ---------- View modal ---------- */

function openView(dateKey) {
  currentViewDate = dateKey;

  const modal =
    document.getElementById("viewModal");

  const title =
    document.getElementById("modalTitle");

  const content =
    document.getElementById("modalContent");

  const day = getDayData(dateKey);

  title.textContent =
    formatDate(dateKey);

  content.innerHTML = "";

  SECTIONS.forEach((section, sectionIndex) => {

    const sectionElement =
      document.createElement("div");

    sectionElement.className =
      "modal-section";

    const heading =
      document.createElement("h3");

    heading.textContent =
      `${section.emoji} ${section.title}`;

    sectionElement.appendChild(heading);

    section.tasks.forEach((task, taskIndex) => {

      const id = `${sectionIndex}-${taskIndex}`;
      const complete = day.checked[id] === true;

      const row =
        document.createElement("div");

      row.className = "modal-task";

      row.innerHTML = `
        <span class="modal-check ${
          complete ? "complete" : "incomplete"
        }">
          ${complete ? "✓" : "○"}
        </span>

        <span>
          ${escapeHtml(task)}
        </span>
      `;

      sectionElement.appendChild(row);
    });

    content.appendChild(sectionElement);
  });

  modal.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document
    .getElementById("viewModal")
    .classList.remove("open");

  document.body.style.overflow = "";
}

document
  .getElementById("closeModal")
  .addEventListener("click", closeModal);

document
  .getElementById("viewModal")
  .addEventListener("click", event => {
    if (event.target.id === "viewModal") {
      closeModal();
    }
  });

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeModal();
  }
});

/* ---------- Rewards ---------- */

function renderReward() {
  const selected =
    document.querySelector(
      'input[name="reward"]:checked'
    );

  const display =
    document.getElementById("selectedReward");

  if (selected) {
    display.textContent =
      `Your reward: ${selected.value} 💕`;
  } else {
    display.textContent =
      "Choose a reward above 💕";
  }

  const dates = getRecentDateKeys(7);

  const weeklyStars =
    dates.reduce(
      (total, dateKey) =>
        total + getCheckedCount(dateKey),
      0
    );

  document.getElementById("weeklyStars").textContent =
    `${weeklyStars} Stars`;
}

document
  .querySelectorAll('input[name="reward"]')
  .forEach(input => {

    input.addEventListener("change", () => {

      appData.reward = input.value;

      saveData();
      renderReward();
    });
  });

function restoreReward() {
  if (!appData.reward) {
    renderReward();
    return;
  }

  const input =
    document.querySelector(
      `input[name="reward"][value="${CSS.escape(appData.reward)}"]`
    );

  if (input) {
    input.checked = true;
  }

  renderReward();
}

/* ---------- Tabs ---------- */

document
  .querySelectorAll(".tab")
  .forEach(tab => {

    tab.addEventListener("click", () => {

      const pageName =
        tab.dataset.page;

      document
        .querySelectorAll(".tab")
        .forEach(item =>
          item.classList.remove("active")
        );

      document
        .querySelectorAll(".page")
        .forEach(page =>
          page.classList.remove("active")
        );

      tab.classList.add("active");

      document
        .getElementById(pageName)
        .classList.add("active");

      if (pageName === "progress") {
        renderProgress();
      }

      if (pageName === "reward") {
        renderReward();
      }
    });
  });

/* ---------- Date display ---------- */

function updateDateDisplay() {
  document.getElementById("todayDate").textContent =
    new Date().toLocaleDateString(undefined, {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    });
}

/* ---------- Safe text handling ---------- */

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

/* ---------- Start application ---------- */

updateDateDisplay();
renderChecklist();
updateTodaySummary();
renderProgress();
restoreReward();

/*
  If the page remains open across midnight,
  refresh the visible date/checklist automatically.
*/
let initialDateKey = getDateKey();

setInterval(() => {

  const newDateKey = getDateKey();

  if (newDateKey !== initialDateKey) {
    initialDateKey = newDateKey;

    appData = loadData();

    updateDateDisplay();
    renderChecklist();
    updateTodaySummary();
    renderProgress();
    restoreReward();
  }

}, 60000);
</script>

</body>
</html>
